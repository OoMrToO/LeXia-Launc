# GitHub's machines for private repositories have 7 GB of memory: one Gradle JVM, Kotlin inside
# it (no second daemon), and R8 for one APK at a time (build.yml builds the two one after the other).
org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
