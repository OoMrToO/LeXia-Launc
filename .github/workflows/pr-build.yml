name: Pull request build

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "nuvio/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/pr-build.yml"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate settings keys
        run: python3 scripts/check_prefs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Run unit and screen tests
        run: gradle testFullDebugUnitTest --no-daemon
      - name: Assemble Android TV variants
        run: gradle assembleFullDebug assembleSetupDebug --no-daemon
      - name: Upload Android TV test APKs
        uses: actions/upload-artifact@v4
        with:
          name: lexia-pr-test-apks
          path: |
            app/build/outputs/apk/full/debug/*.apk
            app/build/outputs/apk/setup/debug/*.apk
          if-no-files-found: error
          retention-days: 7
