name: Daily pick

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pick.py
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pick.json
          git commit -m "Günlük öneri" || echo "değişiklik yok"
          # Another job (a build) may have pushed meanwhile.
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done

  publish:
    needs: pick
    uses: ./.github/workflows/publish.yml
    secrets: inherit
