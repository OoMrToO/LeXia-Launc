name: Publish files

# Puts what the TV reads on the files site (Cloudflare Pages): the film list, the newest APK and
# its number. No pages, no counters, no remote settings.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: lexia-tv
      WRANGLER: wrangler@3.99.0
      DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
      DIST_REPO: exxsss/Lxialnch
      DIST_BRANCH: qe46fjffumnk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p out/apk
          cp pick.json out/
          if gh release download latest -p app.apk -p kur.apk -p version.txt -D rel 2>/dev/null; then
            cp rel/app.apk out/apk/app.apk
            cp rel/app.apk out/apk/test.apk
            cp rel/kur.apk out/kur.apk
            cp rel/version.txt out/version.txt
            cp rel/version.txt out/test.txt
          else
            echo "Henüz derleme yok; yalnızca film listesi yayınlanıyor."
          fi
          cat > out/_headers <<'H'
          /*
            X-Content-Type-Options: nosniff
            X-Robots-Tag: noindex, nofollow
            Cache-Control: no-cache
          /pick.json
            Cache-Control: public, max-age=300
          H
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          du -sh out
      - name: Deploy
        run: |
          npx -y $WRANGLER pages project create $PROJECT --production-branch main 2>/dev/null || true
          npx -y $WRANGLER pages deploy out --project-name $PROJECT --branch main --commit-dirty=true
      # The same files on GitHub, for TVs that cannot open pages.dev. A separate account's public
      # repository, on its own branch (an unguessable name) (its "main" belongs to the first LeXia): one commit, replaced
      # each time. Skipped while the DIST_TOKEN secret is missing.
      - name: Copy for TVs that cannot open pages.dev
        if: env.DIST_TOKEN != ''
        run: |
          set -e
          # A pasted secret often carries a space or line break; git rejects the URL then.
          TOKEN=$(printf '%s' "$DIST_TOKEN" | tr -d '[:space:]')
          M=$(mktemp -d)
          mkdir -p $M/apk
          for f in pick.json version.txt test.txt kur.apk apk/app.apk apk/test.apk; do
            if [ -f out/$f ]; then cp out/$f $M/$f; fi
          done
          cd $M
          git init -q -b "$DIST_BRANCH"
          git add -A
          git -c user.name="LeXia" -c user.email="lexia@users.noreply.github.com" commit -q -m "$(cat version.txt 2>/dev/null || echo files)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${DIST_REPO}.git" "$DIST_BRANCH"
          # The first copy used the branch "tv"; it is removed.
          git push -q "https://x-access-token:${TOKEN}@github.com/${DIST_REPO}.git" --delete tv 2>/dev/null || true
          echo "Kopya güncellendi: $(cat version.txt 2>/dev/null)"
          sleep 5
          curl -sS -o /dev/null -w "kopya version.txt %{http_code}\n" "https://raw.githubusercontent.com/${DIST_REPO}/${DIST_BRANCH}/version.txt" || true
      # Checks from outside that a TV can get the files (address, status, size).
      - name: Check
        run: |
          HOST=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" |
            python3 -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
          sleep 20
          for p in version.txt pick.json apk/app.apk kur.apk; do
            curl -sS -o /dev/null -w "$p %{http_code} %{content_type} %{size_download}\n" "https://$HOST/$p?t=$(date +%s)" || echo "$p FAILED"
          done
          echo "version.txt: $(curl -sS "https://$HOST/version.txt?t=$(date +%s)")"
          echo "---- Sertifika zinciri ----"
          openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts </dev/null 2>/dev/null | grep -E "^ *[0-9]+ s:|^ +i:|NotAfter" || true
